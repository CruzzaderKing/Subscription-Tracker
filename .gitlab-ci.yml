stages:
  - validate

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci

validate:ts-lint-prettier:
  stage: validate
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check
